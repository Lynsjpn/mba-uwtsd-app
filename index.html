<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBA UWTSD — System</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1c2434; --sub:#5b6478; --line:#e4e8f0;
  --acc:#2b4c9b; --acc2:#0e9f6e; --warn:#d97706; --bad:#dc2626; --chip:#eef2fa;
  --alert-bg:#fff8ed; --alertred-bg:#fef2f2; --accT:#2b4c9b;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12161f;--card:#1a2130;--ink:#e7ecf5;--sub:#9aa5bb;--line:#2a3347;
    --chip:#232d42;--alert-bg:#2a2413;--alertred-bg:#2d1a1a;--accT:#8fb0f5;}
}
:root[data-theme="dark"]{--bg:#12161f;--card:#1a2130;--ink:#e7ecf5;--sub:#9aa5bb;--line:#2a3347;
  --chip:#232d42;--alert-bg:#2a2413;--alertred-bg:#2d1a1a;--accT:#8fb0f5;}
:root[data-theme="light"]{--bg:#f6f7fb;--card:#ffffff;--ink:#1c2434;--sub:#5b6478;--line:#e4e8f0;
  --chip:#eef2fa;--alert-bg:#fff8ed;--alertred-bg:#fef2f2;--accT:#2b4c9b;}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}
body{background:var(--bg);color:var(--ink);padding-bottom:60px}
header{background:linear-gradient(135deg,#20355f,#2b4c9b);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
header h1{font-size:1.15rem;font-weight:700}
header p{font-size:.78rem;opacity:.85;margin-top:2px}
.langs button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 10px;margin-left:4px;cursor:pointer;font-size:.78rem}
.langs button.on{background:#fff;color:#2b4c9b;font-weight:700}
nav{display:flex;gap:4px;background:#20355f;padding:0 12px;overflow-x:auto}
nav button{background:none;border:none;color:#cdd8f0;padding:10px 14px;font-size:.85rem;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:#fff;border-color:#7fd1ae;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:1rem;margin-bottom:10px;color:var(--accT)}
.grid{display:grid;gap:12px}
@media(min-width:760px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}}
.big{font-size:2rem;font-weight:800;color:var(--accT)}
.sub{font-size:.78rem;color:var(--sub)}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 10px;font-size:.75rem;margin:2px;color:var(--accT)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{background:var(--chip);text-align:left;padding:7px 8px;font-size:.75rem;color:var(--sub)}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.85rem;background:var(--card);color:var(--ink);width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc2)}
input[type=date],input[type=number]{width:auto}
button.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.85rem;cursor:pointer}
button.btn.green{background:var(--acc2)} button.btn.gray{background:#8a93a6} button.btn.small{padding:4px 10px;font-size:.75rem}
.bar{background:var(--line);border-radius:8px;height:10px;overflow:hidden}
.bar>div{height:100%;background:var(--acc2);transition:width .3s}
.done{text-decoration:line-through;color:var(--sub)}
.alert{border-left:4px solid var(--warn);background:var(--alert-bg);padding:10px 12px;border-radius:8px;font-size:.85rem;margin-bottom:10px}
.alert.red{border-color:var(--bad);background:var(--alertred-bg)}
.del{color:var(--bad);cursor:pointer;font-weight:700;padding:0 6px}
.small-note{font-size:.72rem;color:var(--sub);margin-top:6px}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
a{color:var(--accT)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-wrap table{min-width:620px}
@media(max-width:600px){#bkNote{display:none} main{padding:10px} .card{padding:12px} body{padding-bottom:70px}}
.semtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.semtabs button{background:var(--chip);color:var(--accT);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:.78rem;cursor:pointer}
.semtabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.att-hadir{color:var(--acc2);font-weight:600}.att-absen,.att-rekaman{color:var(--bad);font-weight:600}
.wk{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--line);position:relative;margin-top:8px}
.wk .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.wk .col>div{width:70%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.wk .col.now>div{background:var(--acc2)}
.wk .tgt{position:absolute;left:0;right:0;border-top:2px dashed var(--warn)}
.wk-lbl{display:flex;gap:6px}.wk-lbl span{flex:1;text-align:center;font-size:.68rem;color:var(--sub)}
.up-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.85rem;align-items:baseline}
.up-row b{white-space:nowrap}
details summary{cursor:pointer;font-size:.85rem;color:var(--accT);margin-top:10px}
textarea{min-height:60px;resize:vertical;line-height:1.6}
.notes-wrap{display:grid;gap:14px}
@media(min-width:760px){.notes-wrap{grid-template-columns:260px 1fr}.notes-side{position:sticky;top:10px;align-self:start;max-height:calc(100vh - 110px);overflow:auto}}
.notes-wrap .card{margin-bottom:0}
.nitem{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.nitem:hover{background:var(--chip)}.nitem.on{background:var(--chip);border-color:var(--line)}
.ntitle{font-size:1.4rem;font-weight:700;border:none;background:none;padding:4px 0;border-radius:0}
.ntitle:focus{outline:none;border-bottom:2px solid var(--line)}
.ntool{display:flex;gap:4px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:8px}
.ntool button{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:.8rem;cursor:pointer;min-width:34px}
.ned{min-height:55vh;outline:none;line-height:1.8;font-size:.95rem;padding:4px 2px}
.ned h1{font-size:1.5rem;margin:.7em 0 .2em}.ned h2{font-size:1.2rem;margin:.8em 0 .2em;color:var(--accT)}.ned h3{font-size:1.05rem;margin:.6em 0 .2em}
.ned p{margin:.15em 0}.ned ul,.ned ol{padding-left:1.5em;margin:.2em 0}
.ned blockquote{border-left:3px solid var(--line);padding-left:12px;color:var(--sub);margin:.4em 0}
.ned hr{border:none;border-top:1px solid var(--line);margin:1em 0}
.ned code{background:var(--chip);padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:.85em}
.ned ul.todo{list-style:none;padding-left:.2em}
.ned ul.todo>li{position:relative;padding-left:1.8em}
.ned ul.todo>li::before{content:"";position:absolute;left:0;top:.42em;width:1em;height:1em;border:2px solid var(--sub);border-radius:4px;cursor:pointer;box-sizing:border-box}
.ned ul.todo>li[data-done="1"]::before{background:var(--acc2);border-color:var(--acc2)}
.ned ul.todo>li[data-done="1"]::after{content:"✓";position:absolute;left:.18em;top:.05em;color:#fff;font-size:.8em;font-weight:700;pointer-events:none}
.ned ul.todo>li[data-done="1"]{color:var(--sub);text-decoration:line-through}
.ned:empty::before{content:"…";color:var(--sub)}
</style>
</head>

<footer>

  </div>
  <div class="small-note" id="bkNote" style="text-align:center;width:100%"></div>
</footer>

/* Draf dipakai dari data (S.drafts) bila ada — supaya versi publik tanpa data pribadi
   tetap bisa menampilkan draf setelah pengguna memuat filenya sendiri. */
function activeDrafts(){ return (S&&S.drafts&&S.drafts.length)?S.drafts:DRAFTS; }
function jchars(s){ return s.replace(/\s/g,"").length; }
function fallbackCopy(txt,done,selId){
  const ta=document.createElement("textarea");
  ta.value=txt; ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  document.body.removeChild(ta);
  if(ok){ done(); return; }
  // Cadangan terakhir: seleksi teksnya di halaman supaya user cukup menekan Ctrl+C
  const el=selId?document.getElementById(selId):null;
  if(el){
    const r=document.createRange(); r.selectNodeContents(el);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    el.scrollIntoView({block:"center",behavior:"smooth"});
  }
  alert(T().drafCopyFail);
}
function flashBtn(btnId){
  const b=document.getElementById(btnId); if(!b)return;
  const orig=b.textContent; b.textContent=T().drafCopied;
  setTimeout(()=>{ const el=document.getElementById(btnId); if(el)el.textContent=orig; },1600);
}
function copySection(di,si,btnId){
  const d=activeDrafts()[di]; const txt=si<0
    ? d.sections.map(s=>s.h+"\n\n"+s.text).join("\n\n")
    : d.sections[si].text;
  const done=()=>flashBtn(btnId);
  const selId=si<0?null:("txt"+si);
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done,selId));
  } else fallbackCopy(txt,done,selId);
}

const KEY="mba_uwtsd_system_v1";

const CUR_SCHEMA=5;
const cp=x=>JSON.parse(JSON.stringify(x));
const uid=p=>(p||"x")+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* Membawa data lama (localStorage / file JSON) ke struktur terbaru tanpa membuang isian pengguna.
   Daftar lama yang diganti disimpan di s.archiveV4 supaya tidak ada yang hilang. */
function migrate(raw){
  const s=Object.assign(cp(SEED),raw);
  if((!s.drafts||!s.drafts.length)&&DRAFTS.length) s.drafts=cp(DRAFTS);
  if(!s.schemaVer||s.schemaVer<4){
    s.berkas=cp(SEED.berkas);
    if(DRAFTS.length) s.drafts=cp(DRAFTS);
    s.milestones=cp(SEED.milestones); s.weeklyActions=cp(SEED.weeklyActions);
    s.contacts=cp(SEED.contacts); s.myFields=cp(SEED.myFields); s.mySuggestions=cp(SEED.mySuggestions);
    s.schemaVer=4;
  }
  if(s.schemaVer<5){ // fase pendaftaran → fase kuliah
    s.archiveV4={weeklyActions:s.weeklyActions,milestones:s.milestones,berkas:cp(s.berkas||[]),helloWork:cp(s.helloWork||[]),
      payments:cp(s.payments||[]),kyufu:cp(s.kyufu||[]),modules:cp(s.modules||[]),settings:cp(s.settings||{})};
    const untouched=(a,f)=>!a||!a.length||a.every(f);
    s.settings=Object.assign(cp(SEED.settings),{weeklyTarget:(s.settings&&s.settings.weeklyTarget)||SEED.settings.weeklyTarget});
    s.weeklyActions=cp(SEED.weeklyActions);
    s.milestones=cp(SEED.milestones);
    (s.berkas||[]).forEach(b=>b.s="Selesai");
    if(SEED.helloWork.length) s.helloWork=cp(SEED.helloWork);
    if(untouched(s.payments,p=>!p.paid&&!p.dt)&&SEED.payments.length) s.payments=cp(SEED.payments);
    if(untouched(s.kyufu,k=>!k.done&&!k.amt&&!k.dt)&&SEED.kyufu.length) s.kyufu=cp(SEED.kyufu);
    if(untouched(s.modules,m=>m.s==="Belum")&&SEED.modules.length) s.modules=cp(SEED.modules);
    s.schemaVer=5;
  }
  // kunci baru & id stabil (dipakai sinkron kalender dan tautan catatan)
  ["semesters","sessions","assignments","notes","thesisPlan","studyLog","books"].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=cp(SEED[k]||[]); });
  if(!s.thesis) s.thesis=cp(SEED.thesis);
  s.settings=Object.assign(cp(SEED.settings),s.settings||{});
  if(!s.gcalMap) s.gcalMap={};
  s.sessions.forEach(x=>{ if(!x.id)x.id=uid("s"); if(!x.sem)x.sem=semOf(x.dt,s); if(x.att===undefined)x.att=""; });
  s.assignments.forEach(x=>{ if(!x.id)x.id=uid("a"); });
  s.milestones.forEach(x=>{ if(!x.id)x.id=uid("m"); });
  s.thesisPlan.forEach(x=>{ if(!x.id)x.id=uid("t"); });
  s.modules.forEach((m,i)=>{ if(m.g===undefined)m.g=""; if(!m.sem)m.sem="";
    if(!m.code){ m.code=(["SM","ABM","MM","OHRM","FM","EL2","THESIS"])[i]||("M"+(i+1)); } });
  // data lama menyimpan nama modul panjang; ubah ke kode
  const codeOf=v=>{ const m=s.modules.find(x=>x.t===v); return m?m.code:v; };
  s.sessions.forEach(x=>{ if(x.mod) x.mod=codeOf(x.mod); });
  s.assignments.forEach(x=>{ if(x.mod) x.mod=codeOf(x.mod); });
  s.studyLog.forEach(x=>{ if(x.m) x.m=codeOf(x.m); });
  s.notes.forEach(x=>{ if(x.tag) x.tag=codeOf(x.tag); });
  s.notes.forEach(n=>{ if(!n.id)n.id=uid("n"); });
  return s;
}

}

function pct(list,f){ if(!list.length)return 0; return Math.round(100*list.filter(f).length/list.length); }

/* ================= HELPERS (fase kuliah) ================= */
function localStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return localStr(new Date()); }
function addDays(ds,n){ const d=new Date(ds+"T00:00:00"); d.setDate(d.getDate()+n); return localStr(d); }
function weekStart(ds){ const d=new Date(ds+"T00:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)); return localStr(d); }
const WD={id:["Min","Sen","Sel","Rab","Kam","Jum","Sab"],en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],ja:["日","月","火","水","木","金","土"]};
function wday(ds){ return ds?WD[LANG][new Date(ds+"T00:00:00").getDay()]:""; }
function curSem(){ return semOf(todayStr(),S); }
const fmtH=h=>(Math.round(h*10)/10).toString();

let semSel=null;
function attStats(sem){
  const list=S.sessions.filter(x=>x.sem===sem&&!x.nc);
  const hadir=list.filter(x=>x.att==="hadir").length;
  const absent=list.filter(x=>x.att==="absen"||x.att==="rekaman").length;
  const recorded=hadir+absent, total=list.length, allowed=Math.floor(total*0.2);
  return {total,hadir,absent,recorded,allowed,left:allowed-absent,pct:recorded?Math.round(100*hadir/recorded):null};
}
function hoursWeek(ws){ return S.studyLog.filter(l=>l.d&&weekStart(l.d)===ws).reduce((a,l)=>a+Number(l.h||0),0); }
function modOpts(sel){ return `<option value="">—</option>`+S.modules.map(m=>`<option value="${esc(m.code||m.t)}" ${(m.code||m.t)===sel?"selected":""}>${esc(m.code||"")}${m.code?" — ":""}${esc(m.t)}</option>`).join(""); }
function modName(code){ const m=S.modules.find(x=>(x.code||x.t)===code); return m?(m.code?m.code:m.t):(code||""); }
function dayBadge(ds){ const d=daysTo(ds); if(d===null)return ""; const c=d<0?"var(--bad)":d<=7?"var(--warn)":"var(--sub)";
  return `<span class="sub" style="color:${c};white-space:nowrap">${d<0?T().late+" "+(-d):d===0?T().todayIs:d} ${d===0?"":T().days}</span>`; }

/* ---------- Kuliah: aksi ---------- */
function byId(list,id){ return list.find(x=>x.id===id); }
function updSess(id,k,v){ const x=byId(S.sessions,id); if(x){ x[k]=v; save(); } }
function delSess(id){ S.sessions=S.sessions.filter(x=>x.id!==id); save(); }
function addSess(){
  const d=document.getElementById("sD").value; if(!d) return;
  S.sessions.push({id:uid("s"),sem:semSel||curSem(),dt:d,t:document.getElementById("sT").value.trim(),mod:document.getElementById("sM").value,att:""});
  save();
}
function bulkAdd(){
  const sem=semSel||curSem(); let n=0;
  document.getElementById("bulkTxt").value.split(/\r?\n/).forEach(line=>{
    const m=line.trim().match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\s*(.*)$/); if(!m) return;
    const dt=`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
    if(S.sessions.some(x=>x.sem===sem&&x.dt===dt)) return;
    S.sessions.push({id:uid("s"),sem,dt,t:m[4].trim(),mod:"",att:""}); n++;
  });
  save(); alert(T().bulkDone(n));
}
function updAsg(id,k,v){ const x=byId(S.assignments,id); if(x){ x[k]=v; save(); } }
function addAsg(){
  const x=document.getElementById("aT").value.trim(); if(!x) return;
  S.assignments.push({id:uid("a"),mod:document.getElementById("aM").value,t:x,due:document.getElementById("aD").value,s:"Belum",g:""});
  save();
}
function addLog(){
  const d=document.getElementById("slD").value,h=document.getElementById("slH").value;
  if(!d||!h) return;
  S.studyLog.unshift({d,h:Number(h),m:document.getElementById("slM").value,t:document.getElementById("slT").value.trim()});
  S.studyLog.sort((a,b)=>a.d<b.d?1:-1); save();
}

let curNote=null, noteQ="", noteF="*", noteTimer=null;
const NOTE_ALLOW={H1:1,H2:1,H3:1,P:1,DIV:1,BR:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,B:1,STRONG:1,I:1,EM:1,U:1,S:1,CODE:1,PRE:1,HR:1,A:1,SPAN:1};
const NOTE_DROP=["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","SVG","MATH","TEMPLATE","LINK","META","FORM","INPUT","BUTTON","TEXTAREA","SELECT","IMG","VIDEO","AUDIO"];
function cleanNode(el){
  [...el.childNodes].forEach(c=>{
    if(c.nodeType===3) return;
    if(c.nodeType!==1){ c.remove(); return; }
    if(NOTE_DROP.includes(c.tagName)){ c.remove(); return; }
    cleanNode(c);
    if(!NOTE_ALLOW[c.tagName]){ c.replaceWith(...c.childNodes); return; }
    [...c.attributes].forEach(a=>{ const n=a.name.toLowerCase();
      const keep=(c.tagName==="UL"&&n==="class"&&a.value==="todo")||(c.tagName==="LI"&&n==="data-done"&&/^[01]$/.test(a.value))||(c.tagName==="A"&&n==="href"&&/^https?:\/\//i.test(a.value));
      if(!keep) c.removeAttribute(a.name); });
    if(c.tagName==="A"){ c.setAttribute("target","_blank"); c.setAttribute("rel","noopener"); }
  });
}
function sanitizeHTML(html){ const doc=new DOMParser().parseFromString("<div>"+(html||"")+"</div>","text/html"); const r=doc.body.firstChild; cleanNode(r); return r.innerHTML; }
const plain=h=>{ const d=document.createElement("div"); d.innerHTML=sanitizeHTML(h); return d.textContent||""; };
function getNote(){ return S.notes.find(n=>n.id===curNote); }
function newNote(tpl,extra){
  const t=T(); const n=Object.assign({id:uid("n"),title:"",html:t.tplBody[tpl]||t.tplBody.blank,tag:"",pin:false,created:Date.now(),upd:Date.now()},extra||{});
  S.notes.unshift(n); curNote=n.id; cur="notes"; try{LS.setItem("mba_tab","notes");}catch(e){}
  save(); const ti=document.getElementById("nTitle"); if(ti&&!n.title) ti.focus();
}
function openNote(id){ flushNote(); curNote=id; render(); }
function delNote(){ if(!confirm(T().nDelQ)) return; S.notes=S.notes.filter(n=>n.id!==curNote); curNote=null; save(); }
function noteForSession(sid){
  const x=byId(S.sessions,sid); if(!x) return;
  const ex=S.notes.find(n=>n.sess===sid); if(ex){ curNote=ex.id; go("notes"); return; }
  newNote("class",{title:`${x.dt} ${x.t||""}`.trim(),tag:x.mod||"",sess:sid});
}
function noteSet(k,v){ const n=getNote(); if(!n) return; n[k]=v; n.upd=Date.now(); saveQuiet(); renderNoteList(); }
function flushNote(){ clearTimeout(noteTimer); const ed=document.getElementById("ned"), n=getNote(); if(ed&&n&&n.html!==ed.innerHTML){ n.html=ed.innerHTML; n.upd=Date.now(); saveQuiet(); } }
function schedNote(){ clearTimeout(noteTimer); noteTimer=setTimeout(()=>{ flushNote(); renderNoteList(); },500); }
function renderNoteList(){

  box.innerHTML=list.length?list.map(n=>`<div class="nitem ${n.id===curNote?'on':''}" onclick="openNote('${n.id}')">
    <div style="font-weight:600;font-size:.88rem">${n.pin?"📌 ":""}${esc(n.title||t.nUntitled)}</div>

    :`<div class="sub" style="padding:8px">${t.nEmpty}</div>`;
}

      <div class="ntool">
        ${[["h1","H1"],["h2","H2"],["h3","H3"],["ul","• "],["ol","1."],["todo","☑"],["quote","❝"],["bold","<b>B</b>"],["italic","<i>I</i>"],["hr","—"]]
          .map(([k,l])=>`<button onmousedown="event.preventDefault();noteCmd('${k}')">${l}</button>`).join("")}</div>
      <div id="ned" class="ned" contenteditable="true" spellcheck="false">${sanitizeHTML(n.html)||"<p><br></p>"}</div>
      <div class="small-note" style="margin-top:10px">${t.nHint}</div>`
    :`<div class="sub" style="padding:30px 0;text-align:center">${t.nPick}</div>`}
    </div>
  </div>`;
}
function edBlock(ed,node){ let b=node; while(b&&b!==ed&&!(b.nodeType===1&&/^(P|DIV|LI|H1|H2|H3|BLOCKQUOTE|PRE)$/.test(b.tagName))) b=b.parentNode; return b; }
function markTodo(){ const s=window.getSelection(); if(!s.rangeCount) return; let n=s.getRangeAt(0).startContainer;
  while(n&&!(n.nodeType===1&&n.tagName==="UL")) n=n.parentNode;
  if(n){ n.classList.add("todo"); n.querySelectorAll(":scope>li").forEach(li=>{ if(!li.dataset.done) li.dataset.done="0"; }); } }
function noteCmd(k){
  const ed=document.getElementById("ned"); if(!ed) return; ed.focus();
  const fb=tag=>document.execCommand("formatBlock",false,tag);
  if(/^h[123]$/.test(k)) fb(k); else if(k==="quote") fb("blockquote");
  else if(k==="ul") document.execCommand("insertUnorderedList"); else if(k==="ol") document.execCommand("insertOrderedList");
  else if(k==="todo"){ document.execCommand("insertUnorderedList"); markTodo(); }
  else if(k==="bold"||k==="italic") document.execCommand(k); else if(k==="hr") document.execCommand("insertHorizontalRule");
  schedNote();
}
function initEditor(){
  const ed=document.getElementById("ned"); if(!ed) return;
  try{ document.execCommand("defaultParagraphSeparator",false,"p"); }catch(e){}
  // Pintasan markdown dideteksi dari event input (bukan keydown) supaya jalan juga di keyboard HP/IME
  ed.addEventListener("input",e=>{ if(e.inputType==="insertText"&&e.data&&/[  　]$/.test(e.data)) mdShortcut(ed); schedNote(); });
  ed.addEventListener("blur",flushNote);
  ed.addEventListener("paste",e=>{ e.preventDefault(); const txt=(e.clipboardData||window.clipboardData).getData("text/plain"); document.execCommand("insertText",false,txt); });
  ed.addEventListener("mousedown",e=>{ const li=e.target.closest&&e.target.closest("ul.todo>li"); if(!li) return;
    if(e.clientX-li.getBoundingClientRect().left<24){ e.preventDefault(); li.dataset.done=li.dataset.done==="1"?"0":"1"; schedNote(); } });
  ed.addEventListener("keydown",e=>{
    const sel=window.getSelection(); if(!sel.rangeCount) return; const r=sel.getRangeAt(0);
    if(e.key==="Enter"&&!e.shiftKey){
      // Enter di poin kosong = keluar dari daftar (seperti Notion)
      let li=r.startContainer; while(li&&li!==ed&&!(li.nodeType===1&&li.tagName==="LI")) li=li.parentNode;
      if(li&&li!==ed&&!li.textContent.trim()){ e.preventDefault(); document.execCommand(li.parentNode.tagName==="OL"?"insertOrderedList":"insertUnorderedList"); document.execCommand("formatBlock",false,"p"); schedNote(); return; }
      setTimeout(()=>{ const s2=window.getSelection(); if(!s2.rangeCount) return; let n=s2.getRangeAt(0).startContainer;
        while(n&&n!==ed&&!(n.nodeType===1&&n.tagName==="LI")) n=n.parentNode;
        if(n&&n!==ed&&n.parentNode&&n.parentNode.classList.contains("todo")&&!n.textContent.trim()) n.dataset.done="0"; },0); return; }
  });
}
const MD_MAP={"#":"h1","##":"h2","###":"h3","-":"ul","*":"ul","・":"ul","1.":"ol","1)":"ol","[]":"todo","[ ]":"todo","「」":"todo",">":"quote","＞":"quote","＃":"h1","＃＃":"h2"};
function mdShortcut(ed){
  const sel=window.getSelection(); if(!sel.rangeCount) return; const r=sel.getRangeAt(0);
  if(!r.collapsed||r.startContainer.nodeType!==3) return;
  const blk=edBlock(ed,r.startContainer); if(!blk||blk===ed) return;
  const pre=document.createRange(); pre.setStart(blk,0); pre.setEnd(r.startContainer,r.startOffset);
  const typed=pre.toString(); const mk=typed.replace(/[  　]$/,"");
  const act=MD_MAP[mk]; if(!act) return;
  const inLi=blk.tagName==="LI"; if(inLi&&act!=="todo") return;
  // hapus penanda (mis. "## ") dari awal blok
  const del=document.createRange(); del.setStart(blk,0); del.setEnd(r.startContainer,r.startOffset); del.deleteContents();
  if(!blk.textContent) blk.innerHTML="<br>";
  const rr=document.createRange(); rr.setStart(blk,0); rr.collapse(true); sel.removeAllRanges(); sel.addRange(rr);
  // ditunda satu tick: execCommand di dalam event input (reentrant) diabaikan browser
  setTimeout(()=>{ if(act==="todo"&&inLi){ markTodo(); schedNote(); } else noteCmd(act); },0);
}

const ymd=ds=>ds.replace(/-/g,"");

function gcalLink(it){

function downloadICS(){
  const e=s=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MBA UWTSD//System//ID","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:MBA UWTSD","X-WR-TIMEZONE:Asia/Tokyo",
    "BEGIN:VTIMEZONE","TZID:Asia/Tokyo","BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:+0900","TZOFFSETTO:+0900","TZNAME:JST","END:STANDARD","END:VTIMEZONE"];
  calItems().forEach(it=>{
    L.push("BEGIN:VEVENT","UID:"+it.key.replace(":","-")+"@mba-uwtsd","DTSTAMP:"+stamp,"SUMMARY:"+e(it.title));
    if(it.desc) L.push("DESCRIPTION:"+e(it.desc));
    if(it.start) L.push(`DTSTART;TZID=Asia/Tokyo:${ymd(it.date)}T${it.start.replace(":","")}00`,`DTEND;TZID=Asia/Tokyo:${ymd(it.date)}T${it.end.replace(":","")}00`);
    else L.push("DTSTART;VALUE=DATE:"+ymd(it.date),"DTEND;VALUE=DATE:"+ymd(addDays(it.date,1)));
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([L.join("\r\n")+"\r\n"],{type:"text/calendar"}));
  a.download="mba-uwtsd.ics"; a.click();
}
let gisPromise=null;
function loadGIS(){

    s.onload=()=>res(); s.onerror=()=>{ gisPromise=null; rej(new Error("Google Identity Services")); }; document.head.appendChild(s); });

function getToken(scope){

    const tc=google.accounts.oauth2.initTokenClient({client_id:S.settings.gcalClientId,scope,hint:S.settings.calEmail||undefined,
      callback:r=>r&&r.access_token?res(r.access_token):rej(new Error((r&&(r.error_description||r.error))||"no token")),
      error_callback:er=>rej(new Error((er&&(er.message||er.type))||"popup"))});
    tc.requestAccessToken({prompt:""});

}

async function gcalSync(){
  const t=T(), msg=document.getElementById("calMsg"), st=S.settings;
  const cid=(document.getElementById("gcid")||{}).value; if(cid!==undefined) st.gcalClientId=cid.trim();
  if(!/^https?:$/.test(location.protocol)){ msg.textContent=t.calOrigin; return; }
  if(!st.gcalClientId){ msg.textContent=t.calNeedId; return; }
  msg.textContent=t.calSyncing;
  const map=S.gcalMap||(S.gcalMap={});
  try{
    await loadGIS();
    let token;
    try{ token=await getToken("https://www.googleapis.com/auth/calendar.app.created"); }
    catch(e){ if(/scope/i.test(e.message)) token=await getToken("https://www.googleapis.com/auth/calendar"); else throw e; }
    const api=async(m,path,body)=>{
      const r=await fetch("https://www.googleapis.com/calendar/v3"+path,{method:m,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
      if(r.status===204) return {};
      const j=await r.json().catch(()=>({}));
      if(!r.ok){ const er=new Error((j.error&&j.error.message)||("HTTP "+r.status)); er.status=r.status; throw er; }
      return j;
    };
    let calId=st.gcalCalId;
    if(calId){ try{ await api("GET","/calendars/"+encodeURIComponent(calId)); }catch(e){ if(e.status===404||e.status===403||e.status===410) calId=""; else throw e; } }
    if(!calId){ const c=await api("POST","/calendars",{summary:"MBA UWTSD",timeZone:"Asia/Tokyo"}); calId=c.id; st.gcalCalId=calId; for(const k in map) delete map[k]; saveQuiet(); }
    const base="/calendars/"+encodeURIComponent(calId)+"/events";
    let a=0,u=0,d=0; const seen={};
    for(const it of calItems()){
      seen[it.key]=1; const body=toGEvent(it), eid=map[it.key];
      if(eid){ try{ await api("PUT",base+"/"+encodeURIComponent(eid),body); u++; continue; }catch(e){ if(e.status!==404&&e.status!==410) throw e; } }
      const ev=await api("POST",base,body); map[it.key]=ev.id; a++; saveQuiet();
    }
    for(const k of Object.keys(map)){ if(seen[k]) continue;
      try{ await api("DELETE",base+"/"+encodeURIComponent(map[k])); }catch(e){ if(e.status!==404&&e.status!==410) throw e; }
      delete map[k]; d++; }
    saveQuiet(); msg.textContent=t.calDone(a,u,d);
  }catch(e){ saveQuiet(); msg.textContent=t.calErr+" "+e.message; }
}

function noteForBook(id){
  const b=byId(S.books,id); if(!b) return;
  const ex=S.notes.find(n=>n.book===id); if(ex){ curNote=ex.id; go("notes"); return; }
  newNote("read",{title:b.t,tag:b.mod||"",book:id});
}
function copyPath(txt,btnId){
  const done=()=>flashBtn(btnId);

  else fallbackCopy(txt,done,null);
}

function trInputs(){
  const src=(document.getElementById("trSrc")||{}).value||"";
  const to=(document.getElementById("trTo")||{}).value||"id";
  const mode=(document.getElementById("trMode")||{}).value||"translate";
  return {src:src.trim(),to,mode};
}
const TR_LANG={id:"bahasa Indonesia",en:"English","ja-easy":"やさしい日本語（N3程度の語彙と短い文）"};
function trPrompt(i){
  const lang=TR_LANG[i.to]||"bahasa Indonesia";
  const base=`あなたは日本のMBA（経営学・会計学）の教材を読む外国人学習者を助けるアシスタントです。学習者の母語はインドネシア語、日本語能力はN1ですが、経営学・会計学の専門用語には不慣れです。`;
  const task={
    translate:`次の日本語を${lang}に訳してください。出力は次の2部構成にしてください。\n【1】訳文（自然で読みやすく。原文の意味を省略しない）\n【2】重要な専門用語（日本語 → ${lang}／英語の定訳 → 1行の説明）を5個以内`,
    terms:`次の日本語に出てくる経営学・会計学の専門用語を抽出し、${lang}で解説してください。各用語について「日本語表記／英語の定訳／2〜3行のやさしい説明／具体例か身近なたとえ」を書いてください。最後に、文章全体の要点を3行で${lang}でまとめてください。`,
    simple:`次の日本語を、意味を変えずに「やさしい日本語」に書き直してください。短い文に分け、専門用語には（かっこ）で簡単な言い換えを添えてください。そのあとで、要点を3行で${lang}にも訳してください。`
  }[i.mode];
  return {sys:base+"\n"+task+"\n専門用語は勝手に意訳せず、定訳を優先してください。",user:i.src};
}
function trGoogle(){
  const i=trInputs(); if(!i.src){ alert(T().trEmpty); return; }
  const tl=i.to==="en"?"en":"id";
  window.open(`https://translate.google.com/?sl=ja&tl=${tl}&op=translate&text=${encodeURIComponent(i.src.slice(0,4000))}`,"_blank","noopener");
}
function trCopyPrompt(){
  const i=trInputs(); if(!i.src){ alert(T().trEmpty); return; }
  const p=trPrompt(i);
  copyPath(p.sys+"\n\n---\n\n"+p.user,"trCp");
}
async function trRun(){
  const t=T(), out=document.getElementById("trOut"), i=trInputs();
  if(!i.src){ out.textContent=t.trEmpty; return; }
  const keyEl=document.getElementById("trKey");
  const key=(keyEl&&keyEl.value.trim())||S.settings.aiKey||"";
  if(!key){ out.textContent=t.trNoKey; return; }
  S.settings.aiKey=key; const model=(document.getElementById("trModel")||{}).value||"claude-opus-5";
  S.settings.aiModel=model; saveQuiet();
  out.textContent=t.trRunning;
  const p=trPrompt(i);
  const body={model,max_tokens:8000,system:p.sys,messages:[{role:"user",content:p.user}]};
  const headers={"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
  if(model==="claude-opus-5"||model==="claude-sonnet-5") body.output_config={effort:"low"};
  if(model==="claude-opus-5"){ body.fallbacks="default"; headers["anthropic-beta"]="server-side-fallback-2026-07-01"; }
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ out.textContent=t.trErr+" "+((j.error&&j.error.message)||("HTTP "+r.status)); return; }
    if(j.stop_reason==="refusal"){ out.textContent=t.trRefuse; return; }
    out.textContent=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n").trim()||"(kosong)";
  }catch(e){ out.textContent=t.trErr+" "+e.message; }
}

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBA UWTSD — System</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1c2434; --sub:#5b6478; --line:#e4e8f0;
  --acc:#2b4c9b; --acc2:#0e9f6e; --warn:#d97706; --bad:#dc2626; --chip:#eef2fa;
  --alert-bg:#fff8ed; --alertred-bg:#fef2f2; --accT:#2b4c9b;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12161f;--card:#1a2130;--ink:#e7ecf5;--sub:#9aa5bb;--line:#2a3347;
    --chip:#232d42;--alert-bg:#2a2413;--alertred-bg:#2d1a1a;--accT:#8fb0f5;}
}
:root[data-theme="dark"]{--bg:#12161f;--card:#1a2130;--ink:#e7ecf5;--sub:#9aa5bb;--line:#2a3347;
  --chip:#232d42;--alert-bg:#2a2413;--alertred-bg:#2d1a1a;--accT:#8fb0f5;}
:root[data-theme="light"]{--bg:#f6f7fb;--card:#ffffff;--ink:#1c2434;--sub:#5b6478;--line:#e4e8f0;
  --chip:#eef2fa;--alert-bg:#fff8ed;--alertred-bg:#fef2f2;--accT:#2b4c9b;}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}
body{background:var(--bg);color:var(--ink);padding-bottom:60px}
header{background:linear-gradient(135deg,#20355f,#2b4c9b);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
header h1{font-size:1.15rem;font-weight:700}
header p{font-size:.78rem;opacity:.85;margin-top:2px}
.langs button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 10px;margin-left:4px;cursor:pointer;font-size:.78rem}
.langs button.on{background:#fff;color:#2b4c9b;font-weight:700}
nav{display:flex;gap:4px;background:#20355f;padding:0 12px;overflow-x:auto}
nav button{background:none;border:none;color:#cdd8f0;padding:10px 14px;font-size:.85rem;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:#fff;border-color:#7fd1ae;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:1rem;margin-bottom:10px;color:var(--accT)}
.grid{display:grid;gap:12px}
@media(min-width:760px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}}
.big{font-size:2rem;font-weight:800;color:var(--accT)}
.sub{font-size:.78rem;color:var(--sub)}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 10px;font-size:.75rem;margin:2px;color:var(--accT)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{background:var(--chip);text-align:left;padding:7px 8px;font-size:.75rem;color:var(--sub)}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.85rem;background:var(--card);color:var(--ink);width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc2)}
input[type=date],input[type=number]{width:auto}
button.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.85rem;cursor:pointer}
button.btn.green{background:var(--acc2)} button.btn.gray{background:#8a93a6} button.btn.small{padding:4px 10px;font-size:.75rem}
.bar{background:var(--line);border-radius:8px;height:10px;overflow:hidden}
.bar>div{height:100%;background:var(--acc2);transition:width .3s}
.done{text-decoration:line-through;color:var(--sub)}
.alert{border-left:4px solid var(--warn);background:var(--alert-bg);padding:10px 12px;border-radius:8px;font-size:.85rem;margin-bottom:10px}
.alert.red{border-color:var(--bad);background:var(--alertred-bg)}
.del{color:var(--bad);cursor:pointer;font-weight:700;padding:0 6px}
.small-note{font-size:.72rem;color:var(--sub);margin-top:6px}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
a{color:var(--accT)}
</style>
</head>
<body>
<header>
  <div><h1 id="hTitle"></h1><p id="hTag"></p></div>
  <div class="langs" id="langs"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%">
    <button class="btn green" onclick="exportJSON()" id="btnExp"></button>
    <button class="btn gray" onclick="document.getElementById('imp').click()" id="btnImp"></button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>
  <div class="small-note" id="bkNote" style="text-align:center;width:100%"></div>
</footer>

function fallbackCopy(txt,done,selId){
  const ta=document.createElement("textarea");
  ta.value=txt; ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  document.body.removeChild(ta);
  if(ok){ done(); return; }
  // Cadangan terakhir: seleksi teksnya di halaman supaya user cukup menekan Ctrl+C
  const el=selId?document.getElementById(selId):null;
  if(el){
    const r=document.createRange(); r.selectNodeContents(el);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    el.scrollIntoView({block:"center",behavior:"smooth"});
  }
  alert(T().drafCopyFail);
}
function flashBtn(btnId){
  const b=document.getElementById(btnId); if(!b)return;
  const orig=b.textContent; b.textContent=T().drafCopied;
  setTimeout(()=>{ const el=document.getElementById(btnId); if(el)el.textContent=orig; },1600);
}
function copySection(di,si,btnId){
  const d=activeDrafts()[di]; const txt=si<0
    ? d.sections.map(s=>s.h+"\n\n"+s.text).join("\n\n")
    : d.sections[si].text;
  const done=()=>flashBtn(btnId);
  const selId=si<0?null:("txt"+si);
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done,selId));
  } else fallbackCopy(txt,done,selId);
}

  } }catch(e){}
  const f=JSON.parse(JSON.stringify(SEED)); f.schemaVer=4;
  if(DRAFTS.length) f.drafts=JSON.parse(JSON.stringify(DRAFTS));
  return f;
}
function save(){ localStorage.setItem(KEY,JSON.stringify(S)); render(); }
function setLang(l){ LANG=l; localStorage.setItem("mba_lang",l); document.documentElement.lang=l; render(); }
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="mba-uwtsd-data.json"; a.click();
  localStorage.setItem("mba_last_export",Date.now()); render();
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ S=Object.assign(JSON.parse(JSON.stringify(SEED)),JSON.parse(r.result));
    localStorage.setItem("mba_last_export",Date.now()); save(); alert("OK ✔"); }catch(e){ alert("Invalid file"); } };
  r.readAsText(f);
}
function daysSinceBackup(){
  const t=Number(localStorage.getItem("mba_last_export")||0);
  if(!t) return null; // belum pernah backup
  return Math.floor((Date.now()-t)/86400000);
}

/* ================= HELPERS ================= */
const yen=n=>"¥"+Number(n||0).toLocaleString("ja-JP");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function daysTo(dateStr){ if(!dateStr)return null; const d=(new Date(dateStr+"T00:00:00")-new Date().setHours(0,0,0,0))/86400000; return Math.round(d); }
function pct(list,f){ if(!list.length)return 0; return Math.round(100*list.filter(f).length/list.length); }

/* ================= RENDER ================= */
let cur="dash";

  const t=T();

  document.getElementById("nav").innerHTML=Object.entries(t.tabs).map(([id,l])=>`<button class="${cur===id?'active':''}" onclick="cur='${id}';render()">${l}</button>`).join("");
  document.getElementById("main").innerHTML={dash:vDash,daftar:vDaftar,draf:vDraf,dana:vDana,kuliah:vKuliah,tesis:vTesis,me:vMe}[cur]();
}

    <div class="card"><div class="sub">${t.cdHW}</div>

    <div class="card"><h2>${t.pModul}</h2><div class="bar"><div style="width:${pModul}%"></div></div><div class="sub" style="margin-top:6px">${pModul}${t.pctPass}</div></div>
  </div>
  <div class="grid c2">
    <div class="card"><h2>${t.weekly}</h2>
      ${S.weeklyActions.map((a,i)=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0">
        <input type="checkbox" ${a.d?"checked":""} onchange="S.weeklyActions[${i}].d=this.checked;save()">
        <span class="${a.d?'done':''}" style="flex:1;font-size:.85rem">${esc(a.t)}</span>
        <span class="del" onclick="S.weeklyActions.splice(${i},1);save()">×</span></div>`).join("")}

      <button class="btn small" onclick="const v=document.getElementById('newAct').value.trim();if(v){S.weeklyActions.push({t:v,d:false});save()}">${t.add}</button></div></div>

        <b style="color:${d!==null&&d<7?'var(--bad)':'var(--ink)'}">${ms.due}</b> (${d} ${t.days}) — ${esc(ms.t)}</div>`;}).join(""):`<div class='sub'>${t.msDone}</div>`}
      <div class="small-note">${t.msAll}</div></div>
  </div>
  <div class="card"><h2>${t.brand}</h2>

function vDraf(){
  const t=T();
  const LIST=activeDrafts();
  if(!LIST.length) return `
    <div class="card"><h2>${t.drafTitle}</h2>
      <div class="alert">${t.drafEmpty}</div>
      <div class="sub">${t.drafWhereBody}</div></div>`;
  if(curDraf>=LIST.length) curDraf=0;
  const d=LIST[curDraf];
  const total=d.sections.reduce((a,s)=>a+jchars(s.text),0);
  const overAll=(d.limit&&total>d.limit)||(d.minLimit&&total<d.minLimit);
  return `
  <div class="card"><h2>${t.drafTitle}</h2>
    <div class="sub">${t.drafIntro}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">
      ${LIST.map((x,i)=>`<button class="btn ${i===curDraf?'':'gray'} small" onclick="curDraf=${i};render()">${esc(x.name)}</button>`).join("")}
    </div>
  </div>

  <div class="card"><h2>${t.drafWhere}</h2><div class="sub">${t.drafWhereBody}</div></div>

  <div class="card">
    <h2>${esc(d.name)}</h2>
    <table>
      <tr><th style="width:110px">${t.drafStatus}</th><td>${d.status[LANG]}</td></tr>
      <tr><th>${t.drafSrc}</th><td><code style="font-size:.78rem">${esc(d.src)}</code></td></tr>
      <tr><th>${t.drafNote}</th><td>${d.note[LANG]}</td></tr>
      <tr><th>${t.drafChars}</th><td><b style="color:${overAll?'var(--bad)':'var(--acc2)'}">${total.toLocaleString()}</b> ${t.drafChars}
        ${d.limit?` / ${t.drafLimit} ${d.minLimit?d.minLimit.toLocaleString()+"〜":""}${d.limit.toLocaleString()} — ${overAll?t.drafOver:t.drafOk}`:""}</td></tr>
    </table>
    <div style="margin-top:12px">
      <button class="btn green" id="cpAll" onclick="copySection(${curDraf},-1,'cpAll')">${t.drafCopyAll}</button>
    </div>
  </div>

  ${d.sections.map((s,i)=>{
    const n=jchars(s.text);
    const bad=(s.lim&&n>s.lim)||(s.min&&n<s.min);
    const lbl=s.lim?` / ${t.drafLimit} ${s.min?s.min+"〜":""}${s.lim} ${bad?t.drafOver:t.drafOk}`:"";
    return `<div class="card">
      <div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap">
        <h2 style="flex:1;min-width:200px;margin-bottom:4px">${esc(s.h)}</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="chip" ${bad?'style="color:var(--bad);font-weight:700"':''}>${n.toLocaleString()} ${t.drafChars}${lbl}</span>
          <button class="btn small" id="cp${i}" onclick="copySection(${curDraf},${i},'cp${i}')">${t.drafCopy}</button>
        </div>
      </div>
      <div id="txt${i}" style="white-space:pre-wrap;font-size:.88rem;line-height:1.85;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">${esc(s.text)}</div>
    </div>`;
  }).join("")}`;
}
